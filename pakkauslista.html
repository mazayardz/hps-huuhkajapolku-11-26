<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pakkauslista | HPS P11</title>

<style>
:root{
    --hps-green:#00843D;
    --hps-dark:#005A2E;
    --bg:#f5f7fa;
    --card:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:var(--bg);
    color:#333;
    line-height:1.6;
}

.hero{
    background:linear-gradient(135deg,#00843D,#005A2E);
    color:white;
    text-align:center;
    padding:40px 20px;
}

.logo{
    width:80px;
    height:auto;
    margin-bottom:10px;
}

.container{
    max-width:900px;
    margin:30px auto;
    padding:0 20px;
}

.back-btn{
    display:inline-block;
    margin-bottom:20px;
    background:white;
    color:var(--hps-green);
    text-decoration:none;
    padding:10px 18px;
    border-radius:25px;
    font-weight:600;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card{
    background:var(--card);
    border-radius:16px;
    padding:25px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.section{
    margin-bottom:30px;
}

.section h2{
    color:var(--hps-dark);
    margin-bottom:12px;
    border-left:5px solid var(--hps-green);
    padding-left:10px;
}

ul{
    list-style:none;
}

li{
    padding:10px 0;
    border-bottom:1px solid #eee;
}

li:last-child{
    border-bottom:none;
}

.notice{
    margin-top:25px;
    padding:18px;
    border-radius:12px;
    background:#fff8e1;
    border-left:5px solid #ffa000;
    font-weight:600;
}

.footer{
    text-align:center;
    color:#666;
    margin:30px 0;
}

@media (max-width:768px){
    .card{
        padding:18px;
    }
}
</style>

</head>
<body>

<header class="hero">

    <!-- Vaihda tiedostonimeksi oman logosi nimi -->
    <img src="hps-logo.png" alt="HPS Logo" class="logo">

    <h1>📦 Pakkauslista</h1>
    <p>Huuhkajapolku, Eerikkilä 1.-3.11.2026</p>

</header>

<div class="container">

    <a href="index.html" class="back-btn">
        ← Takaisin aikatauluun
    </a>

    <div class="card">

        <div class="section">
            <h2>⚽ Peli- ja treenivarusteet</h2>
            <ul>
                <li>Pelipaita ja shortsit</li>
                <li>Säärisuojat ja pelisukat</li>
                <li>Nappikset</li>
                <li>Treen
